<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zen OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="os-root">
  <div id="wallpaper"></div>
  <div id="desktop-icons"></div>
  <div id="window-layer"></div>

  <div class="ctx-menu" id="desktop-ctx"></div>

  <div id="start-menu"></div>
  <div id="notif-panel"></div>
  <div id="qs-panel"></div>
  <div id="toast-stack"></div>
  <div id="cmd-palette"></div>
  <div id="alt-tab"></div>

  <div id="taskbar">
    <button id="start-btn">🌸 Zen</button>
    <div id="taskbar-search">🔍 <span>Search Zen OS</span></div>
    <div id="taskbar-apps"></div>
    <div id="systray">
      <button class="tray-btn" id="battery-tray" title="Battery" style="width:auto; padding:0 8px; gap:4px;"><span id="battery-icon-wrap"></span><span id="battery-pct-label" style="font-size:8px;"></span></button>
      <button class="tray-btn" id="wifi-tray">📶</button>
      <button class="tray-btn" id="vol-tray">🔊</button>
      <button class="tray-btn" id="qs-tray">⚙️</button>
      <button class="tray-btn" id="notif-tray">🔔</button>
      <div id="clockbox"><b id="clock-time">--:--</b><span id="clock-date">--</span></div>
    </div>
  </div>
</div>

<div id="boot-screen">
  <div class="boot-inner">
    <div class="boot-logo">🌸<br>ZEN OS</div>
    <div class="boot-bar-track"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
    <div class="boot-log" id="boot-log"></div>
    <div class="boot-skip">press any key to skip</div>
  </div>
</div>
<div id="login-screen">
  <div class="login-clock" id="login-clock">--:--</div>
  <div class="login-card" id="login-card"></div>
</div>
<img id="custom-cursor-img" alt="">

<script src="js/kernel.js"></script>
<script src="js/shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
